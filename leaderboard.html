<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Leaderboard</title>
<link rel="icon" href="icon-192.png">
<style>
:root { --bg:#e6eaee; --board:#fff; --ink:#1d2a36; --muted:#566676; --peer:#eef2f6; --accent:#e8590c; --accent-ink:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#12181e; --board:#1b242d; --ink:#e8edf2; --muted:#93a3b3; --peer:#222d38; --accent:#ff8a3d; --accent-ink:#1a1208; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
main { max-width:480px; margin:0 auto; display:grid; gap:14px; }
.head { display:flex; align-items:center; gap:12px; }
.face { flex:none; width:60px; height:60px; border-radius:50%; object-fit:cover; border:3px solid var(--ink); }
h1 { margin:0; min-width:0; font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; font-size:clamp(28px,8vw,40px); line-height:1; letter-spacing:.03em; text-transform:uppercase; }
.sec { display:grid; gap:6px; margin-bottom:6px; }
.sec h2 { margin:6px 0 0; font:700 28px "Barlow Condensed","Arial Narrow",system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; }
.sec h2.played { color:var(--accent); }
.more { justify-self:start; background:none; border:0; padding:4px 0; color:var(--accent); font-weight:600; font-size:15px; font-family:inherit; text-decoration:underline; cursor:pointer; }
li.gap { background:none !important; color:var(--muted); grid-template-columns:1fr; padding:0 8px; line-height:.8; }
.tabs { display:grid; grid-template-columns:repeat(3,1fr); border:2px solid var(--ink); border-radius:4px; overflow:hidden; }
.tab { background:transparent; color:inherit; border:0; padding:9px 4px; font:600 19px "Barlow Condensed","Arial Narrow",system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
.tab + .tab { border-left:2px solid var(--ink); }
.tab[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
ol { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
li { display:grid; grid-template-columns:28px 1fr auto auto; gap:8px; align-items:baseline; padding:7px 8px; border-radius:4px; background:var(--board); }
li:nth-child(odd) { background:var(--peer); }
.r { font:700 20px "Barlow Condensed",system-ui,sans-serif; color:var(--muted); }
.n { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.t { font:600 22px "Barlow Condensed",system-ui,sans-serif; font-variant-numeric:tabular-nums; }
.d { font-size:13px; color:var(--muted); }
.msg { margin:0; color:var(--muted); }
.btn { display:block; text-align:center; text-decoration:none; background:var(--accent); color:var(--accent-ink); border-radius:4px; padding:12px 16px; font-weight:600; font-size:18px; }
li.me { outline:2px solid var(--accent); }
.hi { margin:0; font:600 22px "Barlow Condensed",system-ui,sans-serif; color:var(--accent); }
a { color:var(--accent); font-weight:600; }
</style>
</head>

<script>
// Reads scores.json from the leaderboard repository. Add ?repo=name/Repo to the address to point it somewhere else.
const repo = new URLSearchParams(location.search).get('repo') || 'justinperris/Sudoku-scores';
const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const q = new URLSearchParams(location.search);
let level = ['easy', 'medium', 'hard'].includes(q.get('level')) ? q.get('level') : 'easy', data = null;
const me = (q.get('me') || '').toLowerCase();
if (q.get('me') && q.get('t')) {
  const hi = document.getElementById('hi');
  hi.textContent = 'Nice work ' + q.get('me') + '! Your time: ' + fmt(parseInt(q.get('t'), 10) || 0);
  hi.hidden = false;
}
const open = {};
function row(r, rank) {
  const li = document.createElement('li');
  if (me && String(r.name).toLowerCase() === me) li.className = 'me';
  [['r', rank], ['n', r.name], ['t', fmt(r.time)], ['d', r.date || '']].forEach(([c, v]) => {
    const s = document.createElement('span'); s.className = c; s.textContent = v; li.appendChild(s);
  });
  return li;
}
function draw() {
  const box = document.getElementById('boards'); box.textContent = '';
  if (!data) return;
  document.getElementById('msg').textContent = '';
  ['easy', 'medium', 'hard'].forEach((lv) => {
    const rows = data[lv] || [];
    const sec = document.createElement('section'); sec.className = 'sec';
    const h2 = document.createElement('h2'); h2.textContent = lv;
    if (lv === level && q.get('me')) h2.className = 'played';
    sec.appendChild(h2);
    if (!rows.length) {
      const p = document.createElement('p'); p.className = 'msg'; p.textContent = 'No times yet. Be the first.'; sec.appendChild(p);
    } else {
      const ol = document.createElement('ol');
      const shown = open[lv] ? 20 : 3;
      rows.slice(0, shown).forEach((r, i) => ol.appendChild(row(r, i + 1)));
      // keep the player's own row in view when it is below the top three
      const mi = rows.findIndex((r) => me && String(r.name).toLowerCase() === me);
      if (mi >= shown) {
        const gap = document.createElement('li'); gap.className = 'gap'; gap.textContent = '...'; ol.appendChild(gap);
        ol.appendChild(row(rows[mi], mi + 1));
      }
      sec.appendChild(ol);
      if (rows.length > 3) {
        const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'more';
        btn.textContent = open[lv] ? 'Show top 3' : 'Show more';
        btn.addEventListener('click', () => { open[lv] = !open[lv]; draw(); });
        sec.appendChild(btn);
      }
    }
    box.appendChild(sec);
  });
}
fetch('https://api.github.com/repos/' + repo + '/contents/scores.json?t=' + Date.now(), { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
